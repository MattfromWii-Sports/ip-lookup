[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I"]  # Errors, Flakes, Warnings, Imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pylint]
max-line-length = 120
disable = ["C0111", "R0913", "R0914"]  # Missing docstring, too many args/locals

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
