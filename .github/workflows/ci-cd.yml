name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 1. Test Python syntax and formatting
  # Uses Ruff as the linter and code formatter
  # Uses Pylint as a static code analyzer
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint
      
      - name: Run Ruff (linter & formatter)
        run: ruff check . --fix
      
      - name: Run Ruff format check
        run: ruff format . --check
      
      - name: Run Pylint
        run: pylint ip-lookup.py --exit-zero

  # 2. Unit tests and code quality
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    env:
      ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-mock
      
      - name: Run unit tests
        run: pytest tests/ -v --cov=. --cov-report=html --cov-report=term
        continue-on-error: true
      
      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
        continue-on-error: true

  # 3. Security scanning
  # Uses Bandit to scan the code
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    env:
      ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run Bandit (security linter)
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Check dependencies for known vulnerabilities
        run: safety check --json
        continue-on-error: true

  # 4. Build and package
  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    name: Build Application
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify application can run
        run: |
          python -c "import ip_lookup; print('Application imports successfully')"
        continue-on-error: true
      
      - name: Create artifact
        run: |
          mkdir -p dist
          cp ip-lookup.py dist/
          cp requirements.txt dist/
          cp README.md dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ip-lookup-build
          path: dist/

  # 5. Create Release (runs on tags)
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: ip-lookup-build
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
